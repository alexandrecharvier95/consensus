services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-consensus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-consensus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-consensus}
      APP_ENV: ${APP_ENV:-dev}
      UVICORN_RELOAD: "${UVICORN_RELOAD:-true}"  # False in production
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  gui:
    build:
      context: ./gui
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_URL: "http://backend:8000"
      APP_ENV: ${APP_ENV:-dev}
    volumes:
      - ./gui:/app
    ports:
      - "3000:3000"
      - "8001:8001"
    depends_on:
      - backend

volumes:
  postgres_data:
