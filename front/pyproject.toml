[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consensus-front"
version = "0.1.0"
description = "Frontend Reflex pour la plateforme Consensus"
requires-python = ">=3.12"
dependencies = [
    "reflex>=0.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["consensus_front"]
