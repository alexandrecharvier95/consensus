[project]
name = "consensus-gui"
version = "0.1.0"
description = "GUI Reflex pour la plateforme Consensus"
requires-python = ">=3.12"
dependencies = [
    "reflex>=0.9.8.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consensus_gui"]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
